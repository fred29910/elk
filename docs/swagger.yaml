paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 登陆
      parameters:
      - description: 登陆参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_cham_elk_pkg_ov.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cham_elk_pkg_ov.Token'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cham_elk_pkg_ov.Error'
      summary: 登陆
      tags:
      - auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: 登出
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cham_elk_pkg_ov.Error'
      summary: 登出
      tags:
      - auth
  /api/auth/refresh_token:
    post:
      consumes:
      - application/json
      description: 刷新token
      parameters:
      - description: 刷新token参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_cham_elk_pkg_ov.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cham_elk_pkg_ov.Token'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cham_elk_pkg_ov.Error'
      summary: 刷新token
      tags:
      - auth
  /api/systems:
    get:
      consumes:
      - application/json
      description: 获取系统config列表
      parameters:
      - in: query
        name: page
        type: integer
      - in: query
        name: page_size
        type: integer
      - in: query
        name: sort_by
        type: string
      - in: query
        name: sort_desc
        type: boolean
      - in: query
        name: status
        type: integer
      - in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 系统config列表
          schema:
            allOf:
            - $ref: '#/definitions/github_com_cham_elk_pkg_ov.PageInfo'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_cham_elk_internal_model_system.System'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cham_elk_pkg_ov.Error'
      summary: 获取系统config列表
      tags:
      - 系统管理
    post:
      consumes:
      - application/json
      description: 创建系统config
      parameters:
      - description: 系统config信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/github_com_cham_elk_pkg_ov.CreateSystem'
      produces:
      - application/json
      responses:
        "200":
          description: 创建系统config
          schema:
            allOf:
            - $ref: '#/definitions/github_com_cham_elk_pkg_ov.Result'
            - properties:
                data:
                  $ref: '#/definitions/github_com_cham_elk_internal_model_system.System'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cham_elk_pkg_ov.Error'
      summary: 创建系统config
      tags:
      - 系统管理
  /api/users:
    get:
      consumes:
      - application/json
      description: 获取用户列表
      parameters:
      - in: query
        name: email
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: page_size
        type: integer
      - in: query
        name: sort_by
        type: string
      - in: query
        name: sort_desc
        type: boolean
      - in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cham_elk_pkg_ov.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cham_elk_pkg_ov.Error'
      summary: 获取用户列表
      tags:
      - 用户管理
    post:
      consumes:
      - application/json
      description: 创建用户
      parameters:
      - description: 用户信息
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/github_com_cham_elk_pkg_ov.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cham_elk_pkg_ov.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cham_elk_pkg_ov.Error'
      summary: 创建用户
      tags:
      - 用户管理
