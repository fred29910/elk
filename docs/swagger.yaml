definitions:
  github_com_cham_elk_internal_model_system.System:
    properties:
      config:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      remark:
        description: 备注
        type: string
      status:
        description: 系统状态，如：1表示运行中，0表示停止
        type: integer
      type:
        description: 系统类型，如：elk
        type: string
      updatedAt:
        type: string
    type: object
  github_com_cham_elk_pkg_ov.CreateSystem:
    properties:
      config:
        type: string
      remark:
        type: string
      status:
        type: integer
      type:
        type: string
    type: object
  github_com_cham_elk_pkg_ov.Error:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  github_com_cham_elk_pkg_ov.LoginRequest:
    properties:
      captcha:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - captcha
    - password
    - username
    type: object
  github_com_cham_elk_pkg_ov.PageInfo:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
      total:
        type: integer
    type: object
  github_com_cham_elk_pkg_ov.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
      token:
        type: string
    required:
    - refresh_token
    - token
    type: object
  github_com_cham_elk_pkg_ov.Result:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
  github_com_cham_elk_pkg_ov.Token:
    properties:
      expires_in:
        type: integer
      refresh_token:
        type: string
      token:
        type: string
      token_type:
        type: string
    type: object
  github_com_cham_elk_pkg_ov.User:
    properties:
      email:
        type: string
      id:
        type: string
      password:
        type: string
      status:
        type: integer
      username:
        type: string
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
