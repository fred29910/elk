openapi: 3.0.3
info:
    title: Calculator Service
    description: Service for multiplying numbers, a Goa teaser
    version: 0.0.1
servers:
    - url: http://localhost:8000
paths:
    /div/{c}/{d}:
        get:
            tags:
                - calc
            summary: divide calc
            description: Divide returns the integral division of two integers.
            operationId: calc#divide
            parameters:
                - name: c
                  in: path
                  description: Left operand
                  required: true
                  schema:
                    type: integer
                    description: Left operand
                    example: 8584858332854249714
                    format: int64
                  example: 3028691644481825793
                - name: d
                  in: path
                  description: Right operand
                  required: true
                  schema:
                    type: integer
                    description: Right operand
                    example: 6185618418485998609
                    format: int64
                  example: 6753856072453194811
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: integer
                                example: 7645857402092006393
                                format: int64
                            example: 8669942364696118850
                "400":
                    description: 'DivByZero: Bad Request response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
    /multiply/{a}/{b}:
        get:
            tags:
                - calc
            summary: multiply calc
            operationId: calc#multiply
            parameters:
                - name: a
                  in: path
                  description: Left operand
                  required: true
                  schema:
                    type: integer
                    description: Left operand
                    example: 5039012453090910183
                    format: int64
                  example: 3972416428556121060
                - name: b
                  in: path
                  description: Right operand
                  required: true
                  schema:
                    type: integer
                    description: Right operand
                    example: 5407411403602583396
                    format: int64
                  example: 5767490711486594202
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: integer
                                example: 1911365538246272757
                                format: int64
                            example: 6118001696206635361
    /update:
        put:
            tags:
                - calc
            summary: update calc
            description: Change account name
            operationId: calc#update
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateRequestBody'
                        example:
                            email: darwin.hoeger@boganbeier.net
                            name: 9vf
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Create'
                            example:
                                href: Rerum facere quas.
                                name: Recusandae rerum dolor aut officiis quos.
                "400":
                    description: 'NotFound: Bad Request response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        Create:
            type: object
            properties:
                href:
                    type: string
                    description: Href of the created resource
                    example: Molestias deserunt ducimus aut atque et.
                name:
                    type: string
                    description: Name of the created resource
                    example: Enim non earum earum consequatur beatae voluptas.
            example:
                href: Saepe ut voluptatibus inventore nulla.
                name: Distinctio aperiam error consequatur ut quis labore.
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: false
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: false
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: false
            example:
                fault: true
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: true
                timeout: false
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
        UpdateRequestBody:
            type: object
            properties:
                email:
                    type: string
                    example: ulises@barton.info
                    format: email
                name:
                    type: string
                    example: txd
                    minLength: 3
                    maxLength: 20
            example:
                email: angelo@price.biz
                name: t72
            required:
                - name
                - email
tags:
    - name: calc
      description: The calc service performs operations on numbers.
